# cargo-deny policy (scripts/audits/check-supply-chain.sh): crates.io only, licenses compatible
# with distributing an MIT binary, no known advisories.
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
