# Builds release archives for every platform of docs/spec.md section 10 on a version tag and
# publishes them with SHA256SUMS and the installer script to the GitHub release of that tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: macos-15, target: x86_64-apple-darwin }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes hyperfine jq musl-tools pipx python3 rsync shellcheck tar
          python3 --version
          pipx --version
          hyperfine --version
          jq --version
          rsync --version | head -n 1
          shellcheck --version
      - name: Graphify
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          pipx install --python python3 "graphifyy==0.9.97"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          test "$(graphify --version)" = "graphify 0.9.97"
          graphify --version
      - name: Toolchain
        run: rustup target add ${{ matrix.target }}
      - name: Validate release tag
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json
          import sys

          packages = json.load(sys.stdin)["packages"]
          versions = [package["version"] for package in packages if package["name"] == "xcalygraph"]
          if len(versions) != 1:
              raise SystemExit("expected exactly one xcalygraph Cargo package")
          print(versions[0])
          ')"
          bash scripts/utils/validate-release-tag.sh "${GITHUB_REF_NAME}" "${version}"
      - name: Gate
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: scripts/tests/test.sh --all
      - name: Build
        run: scripts/build/build-release.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and installer
        run: |
          cd dist && sha256sum -- *.tar.gz > SHA256SUMS
          cp ../scripts/utils/install.sh install.sh
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
