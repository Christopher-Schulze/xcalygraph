# Runs the product gate (format, feature subsets, clippy, tests, debug build) on every push to
# main and every pull request; script regressions run in the release workflow (test.sh --all).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gate-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: gate-${{ runner.os }}-
      - name: Gate
        run: scripts/tests/test.sh
