# Runs the product gate (format, feature subsets, clippy, tests, debug build) on every push to
# main and every pull request; script regressions run in the release workflow (test.sh --all).
# On Windows a release build answers real queries, refreshes after an edit and installs itself.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gate-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: gate-${{ runner.os }}-
      # The gate's own regression test runs `test.sh --all` in a fixture, which checks these tools.
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes hyperfine jq pipx rsync shellcheck
          pipx install --python python3 "graphifyy==0.9.97"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Gate
        run: scripts/tests/test.sh

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: windows-
      - name: Build
        run: cargo build --release --locked --bin xcalygraph
      - name: Queries, refresh and installer
        shell: pwsh
        run: scripts/tests/test-windows-smoke.ps1
