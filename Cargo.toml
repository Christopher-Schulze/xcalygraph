[package]
name = "xcalygraph"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
description = "Dense, agent-readable code graphs and analyses for AI agents"
license = "MIT"
repository = "https://github.com/Christopher-Schulze/xcalygraph"
publish = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
flate2 = "1.1.10"
ignore = "0.4.34"
imagesize = "0.15.0"
lopdf = { version = "0.46.0", default-features = false }
memmap2 = "0.9.12"
quick-xml = "0.42.0"
rayon = "1.12.0"
regex = "1.13.1"
sha2 = "0.11.1"
tar = "0.4.46"
tree-sitter = "0.27.1"
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-c-sharp = { version = "0.23.5", optional = true }
tree-sitter-commonlisp = { version = "0.4.1", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-dart = { version = "0.3.0", optional = true }
tree-sitter-dm = { version = "0.26.0", optional = true }
tree-sitter-elixir = { version = "0.3.5", optional = true }
tree-sitter-erlang = { version = "0.21.0", optional = true }
tree-sitter-fortran = { version = "0.6.0", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-groovy = { version = "0.1.2", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-julia = { version = "0.23.1", optional = true }
tree-sitter-kotlin-ng = { version = "1.1.0", optional = true }
tree-sitter-language = "0.1.9"
tree-sitter-lua = { version = "0.5.0", optional = true }
tree-sitter-objc = { version = "3.0.2", optional = true }
tree-sitter-ocaml = { version = "0.26.0", optional = true }
tree-sitter-pascal = { version = "0.10.2", optional = true }
tree-sitter-php = { version = "0.25.1", optional = true }
tree-sitter-powershell = { version = "0.26.6", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-r = { version = "1.3.0", optional = true }
tree-sitter-robot = { path = "vendor/tree-sitter-robot", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-scala = { version = "0.26.3", optional = true }
tree-sitter-solidity = { version = "1.2.13", optional = true }
tree-sitter-swift = { version = "0.7.4", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-vb-dotnet = { version = "0.1.0", optional = true }
tree-sitter-zig = { version = "1.1.2", optional = true }
ureq = "3.5.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }

[features]
# Time and allocations per pipeline stage; only for scripts/benchmarks/measure-allocations.sh.
stage-stats = []
alloc-stats = ["stage-stats"]
default = ["lang-go", "lang-rust", "lang-python", "lang-typescript", "lang-javascript", "lang-bash", "lang-java", "lang-kotlin", "lang-scala", "lang-groovy", "lang-csharp", "lang-vbnet", "lang-c", "lang-cpp", "lang-objc", "lang-swift", "lang-ruby", "lang-php", "lang-lua", "lang-zig", "lang-elixir", "lang-erlang", "lang-dart", "lang-julia", "lang-r", "lang-ocaml", "lang-fortran", "lang-pascal", "lang-commonlisp", "lang-solidity", "lang-powershell", "lang-robot", "lang-dm"]
lang-go = ["dep:tree-sitter-go"]
lang-rust = ["dep:tree-sitter-rust"]
lang-python = ["dep:tree-sitter-python"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-bash = ["dep:tree-sitter-bash"]
lang-java = ["dep:tree-sitter-java"]
lang-kotlin = ["dep:tree-sitter-kotlin-ng"]
lang-scala = ["dep:tree-sitter-scala"]
lang-groovy = ["dep:tree-sitter-groovy"]
lang-csharp = ["dep:tree-sitter-c-sharp"]
lang-vbnet = ["dep:tree-sitter-vb-dotnet"]
lang-c = ["dep:tree-sitter-c"]
lang-cpp = ["dep:tree-sitter-cpp"]
lang-objc = ["dep:tree-sitter-objc"]
lang-swift = ["dep:tree-sitter-swift"]
lang-ruby = ["dep:tree-sitter-ruby"]
lang-php = ["dep:tree-sitter-php"]
lang-lua = ["dep:tree-sitter-lua"]
lang-zig = ["dep:tree-sitter-zig"]
lang-elixir = ["dep:tree-sitter-elixir"]
lang-erlang = ["dep:tree-sitter-erlang"]
lang-dart = ["dep:tree-sitter-dart"]
lang-julia = ["dep:tree-sitter-julia"]
lang-r = ["dep:tree-sitter-r"]
lang-ocaml = ["dep:tree-sitter-ocaml"]
lang-fortran = ["dep:tree-sitter-fortran"]
lang-pascal = ["dep:tree-sitter-pascal"]
lang-commonlisp = ["dep:tree-sitter-commonlisp"]
lang-solidity = ["dep:tree-sitter-solidity"]
lang-powershell = ["dep:tree-sitter-powershell"]
lang-robot = ["dep:tree-sitter-robot"]
lang-dm = ["dep:tree-sitter-dm"]

# Index integrity checks hash the full derived image in development too.
[profile.release]
strip = true

[profile.dev.package.xxhash-rust]
opt-level = 3
